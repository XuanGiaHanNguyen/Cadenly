services:
  postgres:
    image: postgres:16
    container_name: cadenly-postgres
    environment:
      POSTGRES_DB: cadenly
      POSTGRES_USER: cadenly
      POSTGRES_PASSWORD: cadenly
    ports:
      - "5432:5432"
    volumes:
      - cadenly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadenly -d cadenly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadenly-postgres-data:
