spring:
  application:
    name: scheduler-engine
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cadenly}
    username: ${DB_USER:cadenly}
    password: ${DB_PASSWORD:cadenly}
  jpa:
    # Flyway owns the schema; Hibernate must never auto-generate/alter DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
