[project]
name = "recording-pipeline"
version = "0.1.0"
description = "Recording Pipeline: audio ingestion, transcription, TextRank summarization, and task extraction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "dateparser>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises a real external dependency (faster-whisper, a locally-running Ollama model, or a live scheduler-engine instance), excluded by default",
]
addopts = "-m 'not slow'"
